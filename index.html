<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Angel | Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        
        @keyframes bgShift { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        body { 
            background: linear-gradient(-45deg, #120303, #2e0c0a, #1a0804, #050505); 
            background-size: 400% 400%; 
            animation: bgShift 15s ease infinite; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 50px 20px; 
            overflow-x: hidden; 
            position: relative;
        }

        /* Camada de Fumaça / Névoa de Fundo */
        .smoke-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at 50% 70%, rgba(255, 60, 0, 0.12) 0%, rgba(10, 2, 2, 0.85) 80%);
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .start .smoke-overlay {
            opacity: 1;
            animation: smokeDrift 10s ease-in-out infinite alternate;
        }
        @keyframes smokeDrift {
            0% { transform: translateY(0) scale(1); opacity: 0.7; }
            100% { transform: translateY(-15px) scale(1.06); opacity: 1; }
        }

        /* Fagulhas de Fogo Subindo */
        .sparkles-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
            display: none;
        }
        .start .sparkles-container {
            display: block;
        }
        .sparkle {
            position: absolute;
            bottom: -20px;
            background: radial-gradient(circle, #fff 0%, #ff9e3d 50%, #ff3c00 100%);
            border-radius: 50%;
            animation: riseUp linear infinite;
            box-shadow: 0 0 8px #ff3c00;
        }
        @keyframes riseUp {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { transform: translateY(-110vh) translateX(30px); opacity: 0; }
        }

        /* Tela de Introdução (Tocar para Entrar) */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            cursor: pointer;
        }
        .enter-text {
            font-size: 16px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ff9e3d;
            animation: pulseText 1.5s infinite;
        }
        @keyframes pulseText { 
            0% { opacity: 0.5; } 
            50% { opacity: 1; text-shadow: 0 0 12px #ff3c00; } 
            100% { opacity: 0.5; } 
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 10px rgba(255, 120, 0, 0.4); } 50% { box-shadow: 0 0 25px rgba(255, 120, 0, 0.8), 0 0 10px #ff3c00; } 100% { box-shadow: 0 0 10px rgba(255, 120, 0, 0.4); } }

        /* Elementos da página acima dos efeitos */
        .profile-container, h1, p, .links-container {
            z-index: 2;
        }

        /* Container da Foto com a Auréola de Anjo */
        .profile-container {
            position: relative;
            margin-bottom: 25px;
            opacity: 0;
        }
        .profile-img { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            background-color: #000; 
            border: 2px solid #ff9e3d; 
        }
        /* Auréola */
        .halo {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 18px;
            border: 3px solid #ffaa42;
            border-radius: 50%;
            box-shadow: 0 0 12px #ff6600, inset 0 0 8px #ff6600;
            animation: haloFloat 3s ease-in-out infinite;
        }
        @keyframes haloFloat {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(-5deg); }
            50% { transform: translateX(-50%) translateY(-5px) rotate(5deg); }
        }

        /* Estilização do Nome e do Chifrinho de Diabinho na letra L */
        h1 { 
            font-size: 26px; 
            margin-bottom: 5px; 
            font-weight: 600; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            color: #ffd79e; 
            text-shadow: 0 0 5px #ff7b00, 0 0 15px #ff3c00; 
            opacity: 0; 
            position: relative;
        }
        /* Chifre do Diabinho na ponta da letra L */
        .devil-horn {
            position: relative;
            display: inline-block;
        }
        .devil-horn::after {
            content: '';
            position: absolute;
            top: -12px;
            right: -2px;
            width: 10px;
            height: 12px;
            border-bottom: 3px solid #ff3c00;
            border-right: 3px solid #ff3c00;
            border-radius: 0 100% 0 0;
            transform: rotate(-25deg);
            filter: drop-shadow(0 0 6px #ff3c00);
        }

        p { 
            font-size: 13px; 
            color: #d1b49e; 
            margin-bottom: 40px; 
            text-align: center; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            opacity: 0; 
        }

        .links-container { 
            width: 100%; 
            max-width: 400px; 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
        }

        .link-button { 
            display: block; 
            width: 100%; 
            padding: 16px 20px; 
            background-color: rgba(20, 10, 5, 0.65); 
            color: #ffecd2; 
            text-decoration: none; 
            text-align: center; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 600; 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
            transition: all 0.3s ease; 
            border: 1px solid rgba(255, 120, 0, 0.4); 
            box-shadow: 0 0 10px rgba(255, 60, 0, 0.1); 
            opacity: 0; 
        }

        .link-button:hover { 
            background-color: rgba(255, 120, 0, 0.2); 
            border-color: #ff9e3d; 
            color: #ffffff; 
            box-shadow: 0 0 22px rgba(255, 120, 0, 0.7); 
            transform: translateY(-4px) scale(1.02); 
        }

        /* Gatilhos de Animação após o Clique */
        .start .profile-container { animation: fadeInDown 0.8s ease-out forwards; }
        .start .profile-container .profile-img { animation: pulseGlow 3s infinite; }
        .start h1 { animation: fadeInUp 0.8s ease-out 0.2s forwards; }
        .start p { animation: fadeInUp 0.8s ease-out 0.4s forwards; }
        .start .link-button { animation: fadeInUp 0.6s ease-out forwards; }
        
        .start .link-button:nth-child(1) { animation-delay: 0.60s; } 
        .start .link-button:nth-child(2) { animation-delay: 0.75s; } 
        .start .link-button:nth-child(3) { animation-delay: 0.90s; } 
        .start .link-button:nth-child(4) { animation-delay: 1.05s; }
    </style>
</head>
<body>
    <div class="smoke-overlay"></div>
    <div class="sparkles-container" id="sparkles"></div>

    <div id="intro-screen">
        <span class="enter-text">Tocar para Entrar</span>
    </div>

    <audio id="sfx-abertura" src="abertura.mp3" preload="auto"></audio>
    
    <div class="profile-container">
        <div class="halo"></div>
        <img src="perfil.jpg" alt="Logo Mr. Angel" class="profile-img">
    </div>

    <h1>MR. ANGE<span class="devil-horn">L</span></h1>
    <p>IT Support | Video Editor</p>
    
    <div class="links-container">
        <a href="#" target="_blank" class="link-button">Portfólio de Vídeos</a>
        <a href="#" target="_blank" class="link-button">GitHub</a>
        <a href="#" target="_blank" class="link-button">LinkedIn</a>
        <a href="#" target="_blank" class="link-button">WhatsApp</a>
    </div>

    <script>
        const introScreen = document.getElementById('intro-screen');
        const somAbertura = document.getElementById('sfx-abertura');
        const sparklesContainer = document.getElementById('sparkles');

        function createSparkles() {
            for (let i = 0; i < 35; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                const size = Math.random() * 4 + 2;
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                sparkle.style.left = `${Math.random() * 100}%`;
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 4;
                sparkle.style.animationDuration = `${duration}s`;
                sparkle.style.animationDelay = `${delay}s`;
                sparklesContainer.appendChild(sparkle);
            }
        }

        introScreen.addEventListener('click', () => {
            somAbertura.play().catch(() => console.log("Áudio bloqueado."));
            introScreen.style.opacity = '0';
            setTimeout(() => { introScreen.style.display = 'none'; }, 500);
            document.body.classList.add('start');
            createSparkles();
        });
    </script>
</body>
</html>
