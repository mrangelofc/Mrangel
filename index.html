<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Angel | Links</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        
        @keyframes bgShift { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        /* Animação das fagulhas/brasas subindo */
        @keyframes riseEmbers {
            0% { transform: translateY(0px) scale(0.8); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
        }
        
        body { 
            background: linear-gradient(-45deg, #150505, #260a08, #1a0a05, #050505); 
            background-size: 400% 400%; 
            animation: bgShift 15s ease infinite; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 50px 20px; 
            overflow-x: hidden; 
            position: relative;
        }

        /* Efeito de Fagulhas Flutuantes de Fundo */
        .embers {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .ember {
            position: absolute;
            bottom: -20px;
            background: #ff6600;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3c00, 0 0 15px #ff9e3d;
            animation: riseEmbers 4s infinite ease-in;
        }

        /* --- TELA DE ENTRADA --- */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
            cursor: pointer;
        }
        
        .enter-text {
            font-size: 16px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ff9e3d;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText { 0% { opacity: 0.4; } 50% { opacity: 1; text-shadow: 0 0 12px #ff3c00; } 100% { opacity: 0.4; } }

        /* --- ANIMAÇÕES E ELEMENTOS VISUAIS --- */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 10px rgba(255, 120, 0, 0.4); } 50% { box-shadow: 0 0 25px rgba(255, 120, 0, 0.9), 0 0 12px #ff3c00; } 100% { box-shadow: 0 0 10px rgba(255, 120, 0, 0.4); } }
        
        .profile-container {
            position: relative;
            z-index: 2;
            opacity: 0;
        }

        .profile-img { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 20px; 
            background-color: #000; 
            border: 2px solid #ff9e3d; 
        }

        .content-box {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        /* Estilização exata do Título com a Auréola e o Rabinho do vídeo */
        .logo-title {
            position: relative;
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #ffd79e;
            text-shadow: 0 0 6px #ff7b00, 0 0 18px #ff3c00;
            opacity: 0;
            display: inline-block;
        }

        /* Auréola em cima da letra A */
        .logo-title::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 68%;
            width: 18px;
            height: 7px;
            border: 2px solid #ff9e3d;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3c00;
        }

        /* Rabinho/Chifre na lateral direita */
        .logo-title::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: -12px;
            width: 10px;
            height: 10px;
            border-right: 2px solid #ff3c00;
            border-bottom: 2px solid #ff3c00;
            transform: rotate(45deg);
            box-shadow: 2px 2px 6px rgba(255, 60, 0, 0.6);
        }
