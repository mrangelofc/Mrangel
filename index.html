<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Angel | Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

        body {
            background-color: #080403;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 45px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- TELA INICIAL --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1c0904 0%, #050202 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
            cursor: pointer;
            padding: 20px;
        }

        .enter-btn {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffd79e;
            padding: 20px 36px;
            border: 2px solid #ff7b00;
            border-radius: 12px;
            background: rgba(255, 90, 0, 0.12);
            box-shadow: 0 0 25px rgba(255, 90, 0, 0.45), inset 0 0 15px rgba(255, 90, 0, 0.25);
            text-shadow: 0 0 10px #ff5500;
            animation: pulseEnter 1.6s infinite ease-in-out;
            text-align: center;
        }

        @keyframes pulseEnter {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 90, 0, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 38px rgba(255, 110, 0, 0.85), inset 0 0 20px rgba(255, 110, 0, 0.4); }
        }

        /* --- FUMAÇA VOLUMÉTRICA DE FUNDO --- */
        .smoke-layer {
            position: fixed;
            inset: -15%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .start .smoke-layer { opacity: 1; }

        .smoke-ambient {
            background:
                radial-gradient(ellipse at 25% 30%, rgba(165, 115, 45, 0.26) 0%, transparent 55%),
                radial-gradient(ellipse at 78% 35%, rgba(185, 38, 18, 0.34) 0%, transparent 58%),
                radial-gradient(ellipse at 82% 85%, rgba(215, 75, 15, 0.32) 0%, transparent 55%),
                radial-gradient(ellipse at 20% 80%, rgba(110, 75, 35, 0.22) 0%, transparent 55%);
            filter: blur(28px);
            animation: driftSmoke 14s ease-in-out infinite alternate;
        }

        .smoke-wisps {
            background:
                radial-gradient(circle at 68% 60%, rgba(255, 95, 25, 0.22) 0%, transparent 32%),
                radial-gradient(circle at 42% 45%, rgba(255, 145, 65, 0.14) 0%, transparent 28%),
                radial-gradient(circle at 75% 78%, rgba(255, 70, 15, 0.25) 0%, transparent 35%);
            filter: blur(18px);
            animation: swirlSmoke 9s ease-in-out infinite alternate;
        }

        @keyframes driftSmoke {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(-3%, -2%) scale(1.06) rotate(1.5deg); }
            100% { transform: translate(3%, -4%) scale(1.1) rotate(-1.5deg); }
        }

        @keyframes swirlSmoke {
            0% { transform: translateY(4%) scale(0.95); opacity: 0.55; }
            100% { transform: translateY(-6%) scale(1.12); opacity: 0.95; }
        }

        /* --- FAÍSCAS / BRASAS SUBINDO --- */
        .embers-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
            display: none;
        }
        .start .embers-container { display: block; }

        .ember {
            position: absolute;
            bottom: -20px;
            width: 3px;
            height: 11px;
            border-radius: 50%;
            background: linear-gradient(to top, #ff3c00, #ffbe55);
            box-shadow: 0 0 8px #ff5500, 0 0 14px #ff9e3d;
            animation: emberRise linear infinite;
        }

        @keyframes emberRise {
            0% { transform: translateY(0) translateX(0) rotate(12deg) scale(0.7); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-110vh) translateX(35px) rotate(18deg) scale(1.1); opacity: 0; }
        }

        /* --- AVATAR COM ANEL NEON E EXPLOSÃO DE FAÍSCAS --- */
        .profile-wrapper {
            position: relative;
            width: 132px;
            height: 132px;
            margin-bottom: 22px;
            z-index: 3;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .start .profile-wrapper {
            animation: avatarReveal 0.9s ease-out 0.3s forwards;
        }

        @keyframes avatarReveal {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .profile-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid #ff7b1c;
            box-shadow:
                0 0 15px #ff4500,
                0 0 35px rgba(255, 85, 0, 0.75),
                inset 0 0 18px rgba(255, 110, 20, 0.65);
            animation: ringPulse 3s ease-in-out infinite 1.2s;
        }

        .profile-ring::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #ffd98e;
            border-right-color: #ff6a00;
            filter: blur(1px);
            opacity: 0;
        }

        .start .profile-ring::after {
            animation: fireSweep 3.5s linear infinite 2.5s;
        }

        @keyframes fireSweep {
            0% { transform: rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: rotate(360deg); opacity: 0; }
        }

        @keyframes ringPulse {
            0%, 100% { box-shadow: 0 0 15px #ff4500, 0 0 32px rgba(255, 85, 0, 0.7), inset 0 0 15px rgba(255, 110, 20, 0.6); }
            50% { box-shadow: 0 0 22px #ff6a00, 0 0 48px rgba(255, 100, 0, 0.95), inset 0 0 22px rgba(255, 140, 40, 0.8); }
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #140805;
            position: relative;
            z-index: 2;
        }

        .burst-spark {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffd27d;
            box-shadow: 0 0 8px #ff5500, 0 0 14px #ff9e3d;
            opacity: 0;
            z-index: 1;
        }

        .start .burst-spark {
            animation: sparkBurst 1.3s ease-out 1.1s forwards;
        }

        @keyframes sparkBurst {
            0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
            25% { opacity: 1; }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.2); }
        }

        /* --- TÍTULO MR. ANGEL, AURÉOLA E RABO PULSANDO EM NEON --- */
        .content-box {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 390px;
        }

        .title-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            margin-bottom: 8px;
            opacity: 0;
        }

        .start .title-wrapper {
            animation: fadeSlideUp 0.7s ease-out 1.1s forwards;
        }

        .logo-title {
            font-size: 27px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffe6b3 0%, #ffb35c 45%, #ff551a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(255, 85, 0, 0.65));
            position: relative;
            animation: titleNeonPulse 3s ease-in-out infinite 1.2s;
        }

        @keyframes titleNeonPulse {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 75, 0, 0.55)) drop-shadow(0 0 14px rgba(255, 110, 0, 0.35)); }
            50% { filter: drop-shadow(0 0 12px rgba(255, 115, 0, 0.95)) drop-shadow(0 0 26px rgba(255, 65, 0, 0.85)); }
        }

        .halo-svg {
            position: absolute;
            top: -13px;
            left: -4px;
            width: 44px;
            height: 16px;
            transform: rotate(-8deg);
            filter: drop-shadow(0 0 6px rgba(255, 160, 60, 0.7));
            animation: haloNeonPulse 3s ease-in-out infinite 1.2s;
        }

        @keyframes haloNeonPulse {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(255, 150, 50, 0.6)) drop-shadow(0 0 10px rgba(255, 90, 0, 0.4)); }
            50% { filter: drop-shadow(0 0 10px rgba(255, 200, 90, 1)) drop-shadow(0 0 22px rgba(255, 110, 0, 0.9)); }
        }

        .tail-svg {
            position: absolute;
            right: -24px;
            bottom: -4px;
            width: 30px;
            height: 22px;
            filter: drop-shadow(0 0 6px rgba(255, 60, 0, 0.7));
            animation: tailNeonPulse 3s ease-in-out infinite 1.2s;
        }

        @keyframes tailNeonPulse {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(255, 60, 0, 0.6)) drop-shadow(0 0 10px rgba(255, 40, 0, 0.4)); }
            50% { filter: drop-shadow(0 0 10px rgba(255, 100, 30, 1)) drop-shadow(0 0 22px rgba(255, 50, 0, 0.9)); }
        }

        .subtitle {
            font-size: 13.5px;
            font-weight: 400;
            color: #e2d5cc;
            letter-spacing: 0.8px;
            margin-bottom: 34px;
            text-align: center;
            opacity: 0;
        }

        .start .subtitle {
            animation: fadeSlideUp 0.7s ease-out 1.4s forwards;
        }

        /* --- BOTÕES NEON LARANJA EM CASCATA --- */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-button {
            display: block;
            width: 100%;
            padding: 18px 20px;
            background: rgba(18, 9, 5, 0.58);
            backdrop-filter: blur(4px);
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.6px;
            border: 1.5px solid #ff6a1a;
            box-shadow:
                0 0 12px rgba(255, 85, 0, 0.45),
                inset 0 0 10px rgba(255, 85, 0, 0.22);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            opacity: 0;
        }

        .link-button:hover, .link-button:active {
            background: rgba(255, 95, 20, 0.18);
            border-color: #ffae52;
            box-shadow:
                0 0 22px rgba(255, 110, 20, 0.85),
                inset 0 0 14px rgba(255, 110, 20, 0.4);
            transform: translateY(-2px) scale(1.015);
        }

        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(28px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .start .link-button {
            animation: fadeSlideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .start .link-button:nth-child(1) { animation-delay: 1.7s; }
        .start .link-button:nth-child(2) { animation-delay: 2.0s; }
        .start .link-button:nth-child(3) { animation-delay: 2.3s; }
        .start .link-button:nth-child(4) { animation-delay: 2.6s; }
        .start .link-button:nth-child(5) { animation-delay: 2.9s; }
        .start .link-button:nth-child(6) { animation-delay: 3.2s; }
        .start .link-button:nth-child(7) { animation-delay: 3.5s; }
    </style>
</head>
<body>

    <!-- Tela Inicial -->
    <div id="intro-screen">
        <div class="enter-btn">Tocar para Entrar</div>

    <!-- Áudio de Abertura -->

    <!-- Camadas de Fumaça Realista -->
    <div class="smoke-layer smoke-ambient"></div>
    <div class="smoke-layer smoke-wisps"></div>

    <!-- Faíscas Subindo -->
    <div class="embers-container" id="embers"></div>

    <!-- Foto de Perfil + Anel Neon + Explosão de Faíscas -->
    <div class="profile-wrapper" id="profile-wrapper">
        <div class="profile-ring"></div>
        <img src="perfil.jpg" alt="Mr. Angel" class="profile-img">
    </div>

    <div class="content-box">
        <!-- Título com Auréola e Cauda SVG pulsando em neon -->
        <div class="title-wrapper">
            <svg class="halo-svg" viewBox="0 0 60 22" fill="none">
                <ellipse cx="30" cy="11" rx="24" ry="6.5" stroke="#ffbe55" stroke-width="2.6"/>
            </svg>
            <h1 class="logo-title">MR. ANGEL</h1>
            <svg class="tail-svg" viewBox="0 0 40 28" fill="none">
                <path d="M2 16 C 12 24, 22 6, 32 14" stroke="#ff551a" stroke-width="2.6" stroke-linecap="round"/>
                <polygon points="30,9 38,16 28,19" fill="#ff551a"/>
            </svg>
        </div>

        <p class="subtitle">Acompanhe minhas histórias nas redes abaixo</p>

        <!-- SEUS BOTÕES NA ORDEM EXATA (Substitua apenas COLE_SEU_LINK_AQUI) -->
        <div class="links-container">
            <a href="https://www.xvideos.com/channels/mrangel24" target="_blank" rel="noopener noreferrer" class="link-button">Xvideos</a>
            <a href="https://privacy.com.br/profile/MrAngelofc" target="_blank" rel="noopener noreferrer" class="link-button">Privacy</a>

            <a href="https://x.com/mr4ngell" target="_blank" rel="noopener noreferrer" class="link-button">X (antigo twitter)</a>
            <a href="https://t.me/+ptqfX8C_O284OGEx" target="_blank" rel="noopener noreferrer" class="link-button">Grupo do telegram</a>
            <a href="https://onlyfans.com/mr.4ngell" target="_blank" rel="noopener noreferrer" class="link-button">Onlyfans</a>
            <a href="https://models.cameraprive.com/br/mr-angel" target="_blank" rel="noopener noreferrer" class="link-button">Camera Prive</a>
        </div>
    </div>

    <script>
        const introScreen = document.getElementById('intro-screen');
        const somAbertura = document.getElementById('sfx-abertura');
        const embersContainer = document.getElementById('embers');
        const profileWrapper = document.getElementById('profile-wrapper');

        function createEmbers() {
            for (let i = 0; i < 38; i++) {
                const ember = document.createElement('div');
                ember.classList.add('ember');
                ember.style.left = `${Math.random() * 100}%`;
                ember.style.height = `${Math.random() * 10 + 6}px`;
                ember.style.width = `${Math.random() * 2 + 2}px`;
                ember.style.animationDuration = `${Math.random() * 3 + 2.2}s`;
                ember.style.animationDelay = `${Math.random() * 3}s`;
                embersContainer.appendChild(ember);
            }
        }

        function createRingBurst() {
            const totalSparks = 28;
            for (let i = 0; i < totalSparks; i++) {
                const spark = document.createElement('div');
                spark.classList.add('burst-spark');
                const angle = (i / totalSparks) * Math.PI * 2;
                const startRadius = 64;
                const endRadius = 85 + Math.random() * 25;

                spark.style.left = `${66 + Math.cos(angle) * startRadius}px`;
                spark.style.top = `${66 + Math.sin(angle) * startRadius}px`;
                spark.style.setProperty('--tx', `${Math.cos(angle) * (endRadius - startRadius)}px`);
                spark.style.setProperty('--ty', `${Math.sin(angle) * (endRadius - startRadius)}px`);

                profileWrapper.appendChild(spark);
            }
        }

        // Gerador nativo de som de chamas e brasa crepitando em loop contínuo
        function startFireSound() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;

            const ctx = new AudioCtx();
            const bufferSize = ctx.sampleRate * 4;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);

            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                const rumble = (lastOut + (0.03 * white)) / 1.03;
                lastOut = rumble;
                const crackle = Math.random() > 0.9965 ? (Math.random() * 2 - 1) * 0.55 : 0;
                data[i] = rumble * 2.2 + crackle;
            }

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 520;

            const gain = ctx.createGain();
            gain.gain.value = 0.18; // Ajuste aqui se quiser mais alto (ex: 0.30) ou mais baixo (ex: 0.10)

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start();
        }

        createRingBurst();

        introScreen.addEventListener('click', () => {
            somAbertura.play().catch(() => {});
            startFireSound();

            introScreen.style.opacity = '0';
            setTimeout(() => { introScreen.style.display = 'none'; }, 600);
            document.body.classList.add('start');
            createEmbers();
        });
    </script>
</body>
