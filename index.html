<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mr. Angel | Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

        body {
            background-color: #080403;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: clamp(28px, 6vh, 60px) clamp(16px, 5vw, 32px);
            overflow-x: hidden;
            position: relative;
        }

        /* --- TELA INICIAL: 1 ÚNICO TOQUE --- */
        #intro-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, #1c0904 0%, #050202 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.55s ease;
            cursor: pointer;
            padding: 20px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .enter-btn {
            font-size: clamp(15px, 4.5vw, 22px);
            font-weight: 700;
            letter-spacing: clamp(2px, 0.8vw, 4px);
            text-transform: uppercase;
            color: #ffd79e;
            padding: clamp(16px, 4vw, 22px) clamp(24px, 7vw, 42px);
            border: 2px solid #ff7b00;
            border-radius: 12px;
            background: rgba(255, 90, 0, 0.12);
            box-shadow: 0 0 25px rgba(255, 90, 0, 0.45), inset 0 0 15px rgba(255, 90, 0, 0.25);
            text-shadow: 0 0 10px #ff5500;
            animation: pulseEnter 1.6s infinite ease-in-out;
            text-align: center;
            user-select: none;
            pointer-events: none;
            max-width: 90vw;
        }

        @keyframes pulseEnter {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 90, 0, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 38px rgba(255, 110, 0, 0.85), inset 0 0 20px rgba(255, 110, 0, 0.4); }
        }

        /* --- FUMAÇA VOLUMÉTRICA DE FUNDO --- */
        .smoke-layer {
            position: fixed;
            inset: -15%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .start .smoke-layer { opacity: 1; }

        .smoke-ambient {
            background:
                radial-gradient(ellipse at 25% 30%, rgba(165, 115, 45, 0.26) 0%, transparent 55%),
                radial-gradient(ellipse at 78% 35%, rgba(185, 38, 18, 0.34) 0%, transparent 58%),
                radial-gradient(ellipse at 82% 85%, rgba(215, 75, 15, 0.32) 0%, transparent 55%),
                radial-gradient(ellipse at 20% 80%, rgba(110, 75, 35, 0.22) 0%, transparent 55%);
            filter: blur(28px);
            animation: driftSmoke 14s ease-in-out infinite alternate;
        }

        .smoke-wisps {
            background:
                radial-gradient(circle at 68% 60%, rgba(255, 95, 25, 0.22) 0%, transparent 32%),
                radial-gradient(circle at 42% 45%, rgba(255, 145, 65, 0.14) 0%, transparent 28%),
                radial-gradient(circle at 75% 78%, rgba(255, 70, 15, 0.25) 0%, transparent 35%);
            filter: blur(18px);
            animation: swirlSmoke 9s ease-in-out infinite alternate;
        }

        @keyframes driftSmoke {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(-3%, -2%) scale(1.06) rotate(1.5deg); }
            100% { transform: translate(3%, -4%) scale(1.1) rotate(-1.5deg); }
        }

        @keyframes swirlSmoke {
            0% { transform: translateY(4%) scale(0.95); opacity: 0.55; }
            100% { transform: translateY(-6%) scale(1.12); opacity: 0.95; }
        }

        /* --- FAÍSCAS / BRASAS SUBINDO --- */
        .embers-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
            display: none;
        }
        .start .embers-container { display: block; }

        .ember {
            position: absolute;
            bottom: -20px;
            width: 3px;
            height: 11px;
            border-radius: 50%;
            background: linear-gradient(to top, #ff3c00, #ffbe55);
            box-shadow: 0 0 8px #ff5500, 0 0 14px #ff9e3d;
            animation: emberRise linear infinite;
        }

        @keyframes emberRise {
            0% { transform: translateY(0) translateX(0) rotate(12deg) scale(0.7); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-110vh) translateX(35px) rotate(18deg) scale(1.1); opacity: 0; }
        }

        /* --- AVATAR RESPONSIVO COM ANEL NEON E ZOOM NO ROSTO --- */
        .profile-wrapper {
            position: relative;
            width: clamp(114px, 32vw, 148px);
            height: clamp(114px, 32vw, 148px);
            margin-bottom: clamp(18px, 3vh, 26px);
            z-index: 3;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .start .profile-wrapper {
            animation: avatarReveal 0.9s ease-out 0.25s forwards;
        }

        @keyframes avatarReveal {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .profile-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid #ff7b1c;
            box-shadow:
                0 0 15px #ff4500,
                0 0 35px rgba(255, 85, 0, 0.75),
                inset 0 0 18px rgba(255, 110, 20, 0.65);
            animation: ringPulse 3s ease-in-out infinite 1.1s;
            z-index: 3;
            pointer-events: none;
        }

        .profile-ring::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #ffd98e;
            border-right-color: #ff6a00;
            filter: blur(1px);
            opacity: 0;
        }

        .start .profile-ring::after {
            animation: fireSweep 3.5s linear infinite 2.2s;
        }

        @keyframes fireSweep {
            0% { transform: rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: rotate(360deg); opacity: 0; }
        }

        @keyframes ringPulse {
            0%, 100% { box-shadow: 0 0 15px #ff4500, 0 0 32px rgba(255, 85, 0, 0.7), inset 0 0 15px rgba(255, 110, 20, 0.6); }
            50% { box-shadow: 0 0 22px #ff6a00, 0 0 48px rgba(255, 100, 0, 0.95), inset 0 0 22px rgba(255, 140, 40, 0.8); }
        }

        .profile-img-crop {
            width: calc(100% - 12px);
            height: calc(100% - 12px);
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            z-index: 2;
            background-color: #140805;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 47% 34%;
            transform: scale(1.45);
            transform-origin: 47% 34%;
        }

        .burst-spark {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffd27d;
            box-shadow: 0 0 8px #ff5500, 0 0 14px #ff9e3d;
            opacity: 0;
            z-index: 1;
        }

        .start .burst-spark {
            animation: sparkBurst 1.3s ease-out 1s forwards;
        }

        @keyframes sparkBurst {
            0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
            25% { opacity: 1; }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.2); }
        }

        /* --- CONTAINER PRINCIPAL ADAPTÁVEL --- */
        .content-box {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
        }

        /* --- TÍTULO MR. ANGEL EM NEON --- */
        .title-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            opacity: 0;
        }

        .start .title-wrapper {
            animation: fadeSlideUp 0.7s ease-out 0.95s forwards;
        }

        .logo-title {
            font-size: clamp(23px, 6.8vw, 32px);
            font-weight: 700;
            letter-spacing: clamp(2px, 0.7vw, 3.5px);
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffe6b3 0%, #ffb35c 45%, #ff551a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(255, 85, 0, 0.65));
            position: relative;
            animation: titleNeonPulse 3s ease-in-out infinite 1.2s;
            white-space: nowrap;
        }

        @keyframes titleNeonPulse {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 75, 0, 0.55)) drop-shadow(0 0 14px rgba(255, 110, 0, 0.35)); }
            50% { filter: drop-shadow(0 0 12px rgba(255, 115, 0, 0.95)) drop-shadow(0 0 26px rgba(255, 65, 0, 0.85)); }
        }

        .halo-svg {
            position: absolute;
            top: clamp(-14px, -3.5vw, -11px);
            left: -4px;
            width: clamp(38px, 10vw, 48px);
            height: 16px;
            transform: rotate(-8deg);
            filter: drop-shadow(0 0 6px rgba(255, 160, 60, 0.7));
            animation: haloNeonPulse 3s ease-in-out infinite 1.2s;
        }

        @keyframes haloNeonPulse {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(255, 150, 50, 0.6)) drop-shadow(0 0 10px rgba(255, 90, 0, 0.4)); }
            50% { filter: drop-shadow(0 0 10px rgba(255, 200, 90, 1)) drop-shadow(0 0 22px rgba(255, 110, 0, 0.9)); }
        }

        .tail-svg {
            position: absolute;
            right: clamp(-24px, -6vw, -20px);
            bottom: -4px;
            width: clamp(26px, 7vw, 32px);
            height: 22px;
            filter: drop-shadow(0 0 6px rgba(255, 60, 0, 0.7));
            animation: tailNeonPulse 3s ease-in-out infinite 1.2s;
        }

        @keyframes tailNeonPulse {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(255, 60, 0, 0.6)) drop-shadow(0 0 10px rgba(255, 40, 0, 0.4)); }
            50% { filter: drop-shadow(0 0 10px rgba(255, 100, 30, 1)) drop-shadow(0 0 22px rgba(255, 50, 0, 0.9)); }
        }

        .subtitle {
            font-size: clamp(12.5px, 3.6vw, 15px);
            font-weight: 400;
            color: #e2d5cc;
            letter-spacing: 0.6px;
            margin-bottom: clamp(24px, 4.5vh, 36px);
            text-align: center;
            opacity: 0;
            padding: 0 8px;
        }

        .start .subtitle {
            animation: fadeSlideUp 0.7s ease-out 1.25s forwards;
        }

        /* --- BOTÕES NEON LIMPOS --- */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 2.2vh, 17px);
            pointer-events: none;
        }

        .links-ready .links-container {
            pointer-events: auto;
        }

        .link-button {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: clamp(15px, 3.8vw, 19px) clamp(44px, 11vw, 54px);
            background: rgba(18, 9, 5, 0.64);
            backdrop-filter: blur(4px);
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            font-size: clamp(14px, 3.8vw, 16px);
            font-weight: 500;
            letter-spacing: 0.6px;
            border: 1.5px solid #ff6a1a;
            box-shadow:
                0 0 12px rgba(255, 85, 0, 0.45),
                inset 0 0 10px rgba(255, 85, 0, 0.22);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, border-color 0.25s ease;
            opacity: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-text {
            position: relative;
            z-index: 2;
            transition: color 0.25s ease, text-shadow 0.25s ease;
        }

        .link-icon {
            position: absolute;
            left: clamp(14px, 4vw, 20px);
            width: clamp(20px, 5vw, 23px);
            height: clamp(20px, 5vw, 23px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffb35c;
            z-index: 2;
            filter: drop-shadow(0 0 6px rgba(255, 110, 20, 0.85));
            transition: transform 0.25s ease, color 0.25s ease, filter 0.25s ease;
        }

        .link-icon svg {
            width: 100%;
            height: 100%;
        }

        .link-button:hover,
        .link-button:active {
            background: rgba(255, 85, 10, 0.2);
            border-color: #ffbe66;
            box-shadow:
                0 0 22px rgba(255, 95, 15, 0.85),
                inset 0 0 14px rgba(255, 85, 10, 0.4);
            transform: translateY(-2px) scale(1.015);
        }

        .link-button:hover .btn-text,
        .link-button:active .btn-text {
            color: #fff6e0;
            text-shadow: 0 0 10px rgba(255, 140, 40, 0.85);
        }

        .link-button:hover .link-icon,
        .link-button:active .link-icon {
            color: #ffe2a8;
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(255, 150, 40, 0.95));
        }

        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(28px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .start .link-button {
            animation: fadeSlideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .start .link-button:nth-child(1) { animation-delay: 1.5s; }
        .start .link-button:nth-child(2) { animation-delay: 1.8s; }
        .start .link-button:nth-child(3) { animation-delay: 2.1s; }
        .start .link-button:nth-child(4) { animation-delay: 2.4s; }
        .start .link-button:nth-child(5) { animation-delay: 2.7s; }
        .start .link-button:nth-child(6) { animation-delay: 3.0s; }
        .start .link-button:nth-child(7) { animation-delay: 3.3s; }

        @media (min-width: 768px) {
            .content-box {
                max-width: 480px;
            }
            .link-button {
                padding: 20px 56px;
                border-radius: 10px;
            }
        }
    </style>
</head>
