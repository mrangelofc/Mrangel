    <style>
        :root {
            color-scheme: dark;
            --noite: #090403;
            --ouro: #ecd09a;
            --laranja: #ff8f3c;
            --brasa: #ff5a1f;
            --carmim: #c9281c;
            --creme: #f6e8d4;
            --suave: #cdb9a6;
            --pad: clamp(16px, 5vw, 24px);
            --degrade: linear-gradient(90deg, var(--ouro) 0%, var(--laranja) 52%, var(--carmim) 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100dvh;
            background: radial-gradient(circle at top, #1f0a06 0%, var(--noite) 65%);
            color: var(--creme);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--pad);
        }

        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .avatar {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            margin: 0 auto 16px;
            padding: 3px;
            background: var(--degrade);
            box-shadow: 0 0 28px rgba(255, 90, 31, 0.35);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: var(--noite);
            display: block;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--degrade);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .bio {
            color: var(--suave);
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: block;
            text-decoration: none;
            color: var(--creme);
            font-weight: 600;
            font-size: 0.98rem;
            padding: 15px 20px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(236, 208, 154, 0.22);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--laranja);
            box-shadow: 0 8px 24px rgba(255, 90, 31, 0.25);
        }

        .btn.destaque {
            background: var(--degrade);
            color: #090403;
            border: none;
            font-weight: 700;
        }

        footer {
            margin-top: 32px;
            font-size: 0.78rem;
            color: var(--suave);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="avatar">
            <!-- Coloque sua foto de perfil como avatar.jpg na mesma pasta do index.html -->
            <img src="avatar.jpg" alt="Mr. Angel" onerror="this.style.display='none'">
        </div>

        <h1>Mr. Angel</h1>
        <p class="bio">Perfis oficiais e conteúdo exclusivo.<br>Anjo no rosto, diabo nos detalhes.</p>

        <nav class="links">
            <a class="btn destaque" href="https://privacy.com.br/" target="_blank" rel="noopener noreferrer">Privacy</a>
            <a class="btn" href="https://onlyfans.com/" target="_blank" rel="noopener noreferrer">OnlyFans</a>
            <a class="btn" href="https://instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a class="btn" href="https://x.com/" target="_blank" rel="noopener noreferrer">X (Twitter)</a>
        </nav>

        <footer>© 2026 Mr. Angel · +18</footer>
    </main>
</body>
